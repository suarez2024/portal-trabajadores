<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 20px;
        }

        header {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            color: #6c3483;
        }

        .logout {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .card {
            max-width: 900px;
            margin: 0 auto 20px;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        h2 {
            font-size: 1rem;
            margin-bottom: 14px;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: .8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: .9rem;
        }

        button.primary {
            background: #6c3483;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        button.primary:hover {
            background: #512a63;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
        }

        th,
        td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f7f9fc;
            font-size: .75rem;
            text-transform: uppercase;
            color: #666;
        }

        .msg {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: .85rem;
        }

        .msg.ok {
            background: #e8f8ef;
            color: #1e8449;
        }

        .msg.err {
            background: #fdecea;
            color: #c0392b;
        }
    </style>
</head>

<body>
    <header>
        <h1>Panel de Administración</h1>
        <button class="logout" onclick="logout()">Salir</button>
    </header>

    <div id="mensaje"></div>

    <!-- Crear cliente -->
    <div class="card">
        <h2>Crear cliente</h2>
        <div class="grid">
            <div><label>Nombre contacto</label><input id="c-nombre" placeholder="Carlos Pérez"></div>
            <div><label>Empresa</label><input id="c-empresa" placeholder="Empresa S.A."></div>
            <div><label>Email (login)</label><input id="c-email" type="email" placeholder="cliente@empresa.com"></div>
            <div><label>Contraseña</label><input id="c-pass" placeholder="mínimo 6 caracteres"></div>
        </div>
        <button class="primary" onclick="crearCliente()">Crear cliente</button>
    </div>

    <!-- Crear trabajador -->
    <div class="card">
        <h2>Crear trabajador</h2>
        <div class="grid">
            <div><label>Nombre</label><input id="t-nombre" placeholder="Pedro López"></div>
            <div><label>Email (login)</label><input id="t-email" type="email" placeholder="trabajador@empresa.com">
            </div>
            <div><label>Contraseña</label><input id="t-pass" placeholder="mínimo 6 caracteres"></div>
            <div><label>Tarifa/hora ($)</label><input id="t-tarifa" type="number" step="0.01" value="10"></div>
            <div><label>Cliente asignado</label><select id="t-cliente"></select></div>
        </div>
        <button class="primary" onclick="crearTrabajador()">Crear trabajador</button>
    </div>

    <!-- Listado -->
    <div class="card">
        <h2>Clientes registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Contacto</th>
                    <th>Empresa</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="tabla-clientes"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>Trabajadores registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Tarifa</th>
                    <th>Cliente</th>
                </tr>
            </thead>
            <tbody id="tabla-trabajadores"></tbody>
        </table>
    </div>

    <script type="module">
        import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabase = createClient(
            'https://qcqhxtoffjnhvbqltrnu.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjcWh4dG9mZmpuaHZicWx0cm51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NDkzMzcsImV4cCI6MjEwODIyNTMzN30.0uyZM_wUrIktt0JlqbO9lXipes6yHrj6sSAA3a6pvBM.'
        );

        const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
        if (!usuario || usuario.rol !== 'admin') window.location.href = 'admin-login.html';

        function logout() {localStorage.removeItem('usuario'); window.location.href = 'admin-login.html';}
        window.logout = logout;

        function mostrarMsg(texto, ok = true) {
            const el = document.getElementById('mensaje');
            el.className = 'msg ' + (ok ? 'ok' : 'err');
            el.textContent = texto;
            setTimeout(() => {el.textContent = ''; el.className = '';}, 4000);
        }

        async function cargarClientes() {
            const {data} = await supabase.from('clientes').select('*').order('creado_en');
            const tbody = document.getElementById('tabla-clientes');
            tbody.innerHTML = (data || []).map(c =>
                `<tr><td>${c.nombre}</td><td>${c.empresa}</td><td>${c.email}</td></tr>`
            ).join('') || '<tr><td colspan="3" style="text-align:center;color:#999">Sin clientes</td></tr>';

            // Llenar select de trabajadores
            const sel = document.getElementById('t-cliente');
            sel.innerHTML = '<option value="">— Selecciona cliente —</option>' +
                (data || []).map(c => `<option value="${c.id}">${c.empresa} (${c.nombre})</option>`).join('');
        }

        async function cargarTrabajadores() {
            const {data} = await supabase
                .from('trabajadores')
                .select('*, clientes(empresa)')
                .order('creado_en');
            const tbody = document.getElementById('tabla-trabajadores');
            tbody.innerHTML = (data || []).map(t =>
                `<tr>
      <td>${t.nombre}</td>
      <td>${t.email}</td>
      <td>$${Number(t.tarifa_hora).toFixed(2)}</td>
      <td>${t.clientes ? t.clientes.empresa : '—'}</td>
    </tr>`
            ).join('') || '<tr><td colspan="4" style="text-align:center;color:#999">Sin trabajadores</td></tr>';
        }

        async function crearCliente() {
            const nombre = document.getElementById('c-nombre').value.trim();
            const empresa = document.getElementById('c-empresa').value.trim();
            const email = document.getElementById('c-email').value.trim();
            const password = document.getElementById('c-pass').value;

            if (!nombre || !empresa || !email || !password) {mostrarMsg('Completa todos los campos', false); return;}
            if (password.length < 6) {mostrarMsg('Contraseña mínimo 6 caracteres', false); return;}

            const {error} = await supabase.from('clientes').insert([{nombre, empresa, email, password}]);
            if (error) {mostrarMsg('Error: ' + error.message, false); return;}

            mostrarMsg('Cliente creado correctamente');
            ['c-nombre', 'c-empresa', 'c-email', 'c-pass'].forEach(id => document.getElementById(id).value = '');
            cargarClientes();
        }

        async function crearTrabajador() {
            const nombre = document.getElementById('t-nombre').value.trim();
            const email = document.getElementById('t-email').value.trim();
            const password = document.getElementById('t-pass').value;
            const tarifa = parseFloat(document.getElementById('t-tarifa').value);
            const clienteId = document.getElementById('t-cliente').value || null;

            if (!nombre || !email || !password || isNaN(tarifa)) {mostrarMsg('Completa todos los campos', false); return;}
            if (password.length < 6) {mostrarMsg('Contraseña mínimo 6 caracteres', false); return;}

            const {error} = await supabase.from('trabajadores').insert([{
                nombre, email, password, tarifa_hora: tarifa, cliente_id: clienteId
            }]);
            if (error) {mostrarMsg('Error: ' + error.message, false); return;}

            mostrarMsg('Trabajador creado correctamente');
            ['t-nombre', 't-email', 't-pass'].forEach(id => document.getElementById(id).value = '');
            cargarTrabajadores();
        }

        window.crearCliente = crearCliente;
        window.crearTrabajador = crearTrabajador;

        cargarClientes();
        cargarTrabajadores();
    </script>
</body>

</html>
