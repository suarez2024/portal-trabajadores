<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kageon Global - Client Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="main solo-main page-enter">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px">
                <span class="brand-icon"><span class="icon" data-icon="building" data-size="20"></span></span>
                <div>
                    <h1 id="company-name">Client Dashboard</h1>
                    <p>Manage your virtual assistants and billing.</p>
                </div>
            </div>
            <div class="topbar-actions">
                <span class="badge info"><i></i> Client</span>
                <button class="btn btn-sm" id="logout-btn" type="button">
                    <span class="icon" data-icon="logout" data-size="16"></span> Logout
                </button>
            </div>
        </header>

        <div class="stats">
            <article class="stat">
                <div class="label"><span class="icon-chip"><span class="icon" data-icon="users" data-size="16"></span></span> Active Assistants</div>
                <div class="value" id="stat-assistants">0</div>
            </article>
            <article class="stat">
                <div class="label"><span class="icon-chip green"><span class="icon" data-icon="clock" data-size="16"></span></span> Hours This Month</div>
                <div class="value" id="stat-hours">0.00 h</div>
            </article>
            <article class="stat">
                <div class="label"><span class="icon-chip purple"><span class="icon" data-icon="wallet" data-size="16"></span></span> Estimated Bill</div>
                <div class="value" id="stat-bill">$0.00</div>
            </article>
        </div>

        <div class="card">
            <div class="card-head">
                <div>
                    <h2>My Virtual Assistants</h2>
                    <p>View their tracked hours and profile.</p>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID Code</th>
                            <th>Name</th>
                            <th>Rate (Client)</th>
                            <th>Hours</th>
                            <th>Total to Pay</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabla-asistentes">
                        <!-- Se llena vía JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { api, bootstrap, money, hours, requireRole, setLoading, toast, hydrateIcons } from './app.js';

        await bootstrap();
        const session = requireRole('client', 'index.html');

        if (session) {
            // Simulando datos que vendrían de api.clientData(session)
            document.getElementById('company-name').textContent = session.usuario.empresa || 'Client Dashboard';
            
            // Aquí conectarías con la API real
            const mockAsistentes = [
                { codigo: 'KG-1001', nombre: 'John', rate: 10, horas: 40 },
                { codigo: 'KG-1005', nombre: 'Maria', rate: 12, horas: 35 }
            ];

            let totalHoras = 0;
            let totalBill = 0;
            
            const tbody = document.getElementById('tabla-asistentes');
            tbody.innerHTML = mockAsistentes.map(a => {
                const pago = a.horas * a.rate;
                totalHoras += a.horas;
                totalBill += pago;
                return `
                    <tr>
                        <td><strong>${a.codigo}</strong></td>
                        <td>${a.nombre}</td>
                        <td>$${a.rate}/h</td>
                        <td>${a.horas} h</td>
                        <td><strong>$${pago.toFixed(2)}</strong></td>
                        <td><button class="btn btn-sm">View Profile</button></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('stat-assistants').textContent = mockAsistentes.length;
            document.getElementById('stat-hours').textContent = totalHoras.toFixed(2) + ' h';
            document.getElementById('stat-bill').textContent = '$' + totalBill.toFixed(2);

            document.getElementById('logout-btn').addEventListener('click', async () => {
                await api.logout('client');
                location.replace('index.html');
            });
        }
    </script>
</body>
</html>
